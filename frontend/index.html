<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon et icônes -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/logo.png" />
    <link rel="apple-touch-icon" href="/images/logo.png" />

    <!-- Métadonnées SEO -->
    <title>Baobab Market - E-commerce Africain</title>
    <meta name="description" content="Découvrez Baobab Market, votre destination e-commerce pour des produits africains authentiques. Livraison rapide et paiement sécurisé." />
    <meta name="keywords" content="ecommerce, afrique, produits, livraison, paiement sécurisé" />
    <meta name="author" content="Baobab Market" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Baobab Market - E-commerce Africain" />
    <meta property="og:description" content="Découvrez Baobab Market, votre destination e-commerce pour des produits africains authentiques." />
    <meta property="og:image" content="/images/logo.png" />
    <meta property="og:url" content="https://baobabmarket.com" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Baobab Market - E-commerce Africain" />
    <meta name="twitter:description" content="Découvrez Baobab Market, votre destination e-commerce pour des produits africains authentiques." />
    <meta name="twitter:image" content="/images/logo.png" />

    <!-- Thème et apparence -->
    <meta name="theme-color" content="#FE6F5E" />
    <meta name="msapplication-TileColor" content="#FE6F5E" />

    <!-- Sécurité -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />

    <!-- Performance -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
